# Netlify: build the single-page site with Python (standard library only) and publish dist/.
[build]
  command = "python3 -I site/build.py"
  publish = "dist"

# Serverless functions: the AI mock interviewer (/api/interview), the rest of the API (/api/*,
# netlify/functions/api.mjs -> server/lib) and the weekly Slack digest (scheduled).
# dist/mocks.json and dist/modules.json are written by the build and bundled so the functions can
# build interview prompts and assessment questions server-side.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["dist/mocks.json", "dist/modules.json", "dist/lessons/**"]

# Public community site: indexable, with basic security headers.
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# The service worker must always be revalidated so updates reach users.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
